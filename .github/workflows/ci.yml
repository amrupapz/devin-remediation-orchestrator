name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devin-remediation-orchestrator:ci .
      - name: Smoke check the image
        run: |
          docker run --rm -e DRY_RUN=true -e DB_PATH=/tmp/smoke.db \
            devin-remediation-orchestrator:ci \
            python -c "from app.main import app; print('app ok')"
